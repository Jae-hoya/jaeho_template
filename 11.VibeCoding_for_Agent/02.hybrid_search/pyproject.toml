[project]
name = "hybrid-search"
version = "0.1.0"
description = "Hybrid search for loan products using BM25 and vector search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
