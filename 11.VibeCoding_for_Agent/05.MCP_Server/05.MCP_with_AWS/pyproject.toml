[project]
name = "awslabs.seoul-opendata-mcp-server"
version = "0.0.0"
description = "Unified MCP server for Seoul Open Data APIs (Culture Events + Women & Family Events)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jaeho", email = "skyop45@naver.com" }
]
keywords = ["mcp", "model-context-protocol", "seoul", "opendata", "culture", "women", "events"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "loguru>=0.7.3",
    "mcp[cli]>=1.6.0",
    "fastmcp>=2.14.0",
    "pydantic>=2.10.6",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "commitizen>=4.2.2",
    "pre-commit>=4.1.0",
    "ruff>=0.9.7",
    "pyright>=1.1.398",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
]

[project.urls]
Homepage = "https://github.com/awslabs/mcp"
Documentation = "https://awslabs.github.io/mcp/"
Repository = "https://github.com/awslabs/mcp"
Issues = "https://github.com/awslabs/mcp/issues"

[project.scripts]
seoul-opendata-mcp-server = "awslabs.seoul_opendata_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awslabs"]

[tool.ruff]
line-length = 99
target-version = "py310"
extend-include = ["*.ipynb"]
exclude = [".venv", "**/__pycache__", "**/dist", "**/build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for self in method
    "ANN102",  # Missing type annotation for cls in classmethod
    "COM812",  # Trailing comma missing
    "ISC001",  # Implicitly concatenated string literals on one line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["awslabs", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests that make live API calls (deselect with '-m \"not live\"')",
]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["awslabs"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
version_files = [
    "pyproject.toml:version",
]
update_changelog_on_bump = true
major_version_zero = true
